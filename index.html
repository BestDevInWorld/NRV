<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Каталог товарів</title>

    <!-- Modern, clean font -->
    <link
      rel="preconnect"
      href="https://fonts.googleapis.com"
    />
    <link
      rel="preconnect"
      href="https://fonts.gstatic.com"
      crossorigin
    />
    <link
      href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=swap"
      rel="stylesheet"
    />

    <link rel="stylesheet" href="style.css" />
    <script defer src="script.js"></script>

    <!-- Google tag (gtag.js) -->
    <script async src="https://www.googletagmanager.com/gtag/js?id=G-E33VE2DZMH"></script>
    <script>
      window.dataLayer = window.dataLayer || [];
      function gtag(){dataLayer.push(arguments);}
      gtag('js', new Date());

      gtag('config', 'G-E33VE2DZMH');
    </script>
  </head>
  <body>
    <div class="page">
      <header class="site-header">
        <div class="container">
          <div class="header-bar">
            <div class="branding">
              <div class="logo-circle">
                <img src="Logo.jpg" alt="SmokeCloud" class="logo-image" />
              </div>
              <div class="brand-text">
                <h1 class="site-title">SmokeCloud</h1>
                <p class="site-subtitle">Каталог товарів</p>
              </div>
            </div>

            <button id="cart-button" type="button" class="cart-button" aria-label="Відкрити корзину">
              <span class="cart-icon">🛒</span>
              <span id="cart-count" class="cart-count">0</span>
            </button>
          </div>
        </div>
      </header>

      <main class="site-main">
        <section class="catalog-section">
          <div class="container">
            <div id="loading" class="loading">
              <div class="spinner"></div>
              <p>Завантаження продуктів...</p>
            </div>

            <div id="error" class="error-message" hidden></div>

            <div id="product-grid" class="product-grid" hidden></div>
          </div>
        </section>
      </main>

      <footer class="site-footer">
        <div class="container">
          <p class="footer-text">
            Цей продукт містить нікотин — речовину, що викликає сильну залежність.
            Не рекомендується вагітним та людям із серцево-судинними захворюваннями.
          </p>
        </div>
      </footer>
    </div>

    <!-- Product modal -->
    <div id="modal-overlay" class="modal-overlay" hidden>
      <div
        class="modal"
        role="dialog"
        aria-modal="true"
        aria-labelledby="modal-title"
      >
        <button
          type="button"
          class="modal-close"
          aria-label="Close product details"
        >
          &times;
        </button>

        <div class="modal-content">
          <div class="modal-header">
            <img
              id="modal-image"
              class="modal-image"
              src=""
              alt="Product image"
            />
            <div class="modal-header-text">
              <h2 id="modal-title" class="modal-title"></h2>
              <p id="modal-description" class="modal-description"></p>
            </div>
          </div>

          <div class="modal-body">
            <h3 class="flavors-title">Смаки в наявності</h3>
            <div id="flavor-list" class="flavor-list"></div>
          </div>

          <div class="modal-footer">
            <div class="modal-price">
              <span class="price-label">Ціна</span>
              <span id="modal-price" class="price-value"></span>
            </div>
            <button id="order-button" type="button" class="primary-button" onclick="trackClick('add_to_cart')">
              додати в корзину
            </button>
          </div>
        </div>
      </div>
    </div>

    <!-- Cart sidebar -->
    <div id="cart-overlay" class="cart-overlay" hidden>
      <div class="cart" role="dialog" aria-modal="true" aria-labelledby="cart-title">
        <div class="cart-header">
          <h2 id="cart-title" class="cart-title">Корзина</h2>
          <button
            id="cart-close"
            type="button"
            class="cart-close"
            aria-label="Закрити корзину"
          >
            &times;
          </button>
        </div>

        <div id="cart-items" class="cart-items">
          <!-- Cart items will be rendered here -->
        </div>

        <div class="cart-footer">
          <div class="cart-total">
            <span>Разом:</span>
            <span id="cart-total-value" class="cart-total-value">0</span>
          </div>
          <button
            id="cart-checkout"
            type="button"
            class="primary-button cart-checkout-button"
            onclick="trackClick('go_to_telegram')"
          >
            Оформити замовлення в Telegram
          </button>
        </div>
      </div>
    </div>
  </body>
</html>
